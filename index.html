<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Card Spend</title>
<meta name="theme-color" content="#14532d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Card Spend">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root {
  --bg: #f4f6f3; --panel: #ffffff; --fg: #17201a; --muted: #5f6b63; --line: #dde3dc;
  --brand: #14532d; --brand-fg: #f0fdf4; --accent: #16a34a; --soft: #e7f3ea; --bad: #b42318; --warn: #b54708;
  --r: 14px; --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0e1410; --panel: #161e18; --fg: #e8efe9; --muted: #95a39a; --line: #263229; --brand: #1d6b3c; --brand-fg: #f0fdf4; --accent: #4ade80; --soft: #1c2a20; --bad: #f97066; --warn: #fdb022; color-scheme: dark; }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 16px; -webkit-tap-highlight-color: transparent; }
body { padding: env(safe-area-inset-top) max(16px, env(safe-area-inset-right)) calc(96px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
header { display: flex; align-items: center; justify-content: space-between; padding-top: 12px; }
header h1 { font-size: 20px; margin: 0; }
.iconbtn { background: none; border: 0; color: var(--fg); font-size: 15px; padding: 8px 10px; border-radius: 10px; cursor: pointer; }
.iconbtn:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
.month { display: flex; align-items: center; justify-content: space-between; }
.month b { font-size: 16px; }
.total { font-size: 34px; font-weight: 700; letter-spacing: -0.5px; font-variant-numeric: tabular-nums; margin: 6px 0 2px; }
.sub { color: var(--muted); font-size: 13px; }
.bar { height: 8px; background: var(--soft); border-radius: 99px; overflow: hidden; margin: 10px 0 6px; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; width: 0; transition: width .3s; }
.bar.over > i { background: var(--bad); }
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
.split div { background: var(--soft); border-radius: 10px; padding: 10px; }
.split span { display: block; font-size: 12px; color: var(--muted); }
.split strong { font-variant-numeric: tabular-nums; }
.cats { display: flex; flex-direction: column; gap: 8px; }
.cat-row { display: grid; grid-template-columns: 7.5rem 1fr auto; gap: 8px; align-items: center; font-size: 14px; }
.cat-row .t { height: 6px; background: var(--soft); border-radius: 99px; overflow: hidden; }
.cat-row .t i { display: block; height: 100%; background: var(--brand); }
.cat-row em { font-style: normal; font-variant-numeric: tabular-nums; color: var(--muted); }
h2 { font-size: 15px; margin: 0 0 10px; }
.list { display: flex; flex-direction: column; }
.day { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin: 12px 0 4px; }
.item { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.item:last-child { border-bottom: 0; }
.item .m { min-width: 0; }
.item .m b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .m span { font-size: 12px; color: var(--muted); }
.item .a { font-variant-numeric: tabular-nums; font-weight: 600; }
.item .x { background: none; border: 0; color: var(--muted); font-size: 18px; padding: 4px 8px; cursor: pointer; }
.pending { color: var(--warn); }
.empty { color: var(--muted); font-size: 14px; padding: 8px 0; }
.fab { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom)); background: var(--brand); color: var(--brand-fg); border: 0; border-radius: 99px; padding: 16px 28px; font-size: 17px; font-weight: 600; box-shadow: 0 6px 20px rgba(0,0,0,.25); cursor: pointer; }
.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; justify-content: center; z-index: 20; }
.sheet { background: var(--panel); width: 100%; max-width: 560px; border-radius: 20px 20px 0 0; padding: 18px max(16px, env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); max-height: 92vh; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
.sheet h3 { margin: 0; font-size: 18px; }
label { font-size: 13px; color: var(--muted); display: flex; flex-direction: column; gap: 6px; }
input, select { font: inherit; font-size: 16px; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px; width: 100%; }
.amount { font-size: 32px; font-weight: 700; text-align: center; padding: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 99px; padding: 8px 12px; font-size: 14px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--brand); color: var(--brand-fg); border-color: var(--brand); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.primary { background: var(--brand); color: var(--brand-fg); border: 0; border-radius: 12px; padding: 15px; font-size: 17px; font-weight: 600; cursor: pointer; width: 100%; }
.ghost { background: none; border: 1px solid var(--line); color: var(--fg); border-radius: 12px; padding: 13px; font-size: 15px; cursor: pointer; width: 100%; }
.danger { color: var(--bad); }
.msg { font-size: 13px; color: var(--muted); }
.msg.err { color: var(--bad); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); top: calc(14px + env(safe-area-inset-top)); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 99px; font-size: 14px; z-index: 30; }
.who-toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
@media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Card Spend</h1>
    <div>
      <button class="iconbtn" id="syncBtn" aria-label="Refresh">↻</button>
      <button class="iconbtn" id="settingsBtn">Settings</button>
    </div>
  </header>

  <section class="card" id="summary">
    <div class="month">
      <button class="iconbtn" id="prevM" aria-label="Previous month">‹</button>
      <b id="monthLabel">—</b>
      <button class="iconbtn" id="nextM" aria-label="Next month">›</button>
    </div>
    <div class="total" id="total">AED 0</div>
    <div class="bar" id="budgetBar"><i></i></div>
    <div class="sub" id="budgetText"></div>
    <div class="split">
      <div><span id="n1">Antonio</span><strong id="t1">0</strong></div>
      <div><span id="n2">Rima</span><strong id="t2">0</strong></div>
    </div>
  </section>

  <section class="card">
    <h2>By category</h2>
    <div class="cats" id="cats"></div>
  </section>

  <section class="card">
    <h2>Entries</h2>
    <div class="msg" id="status"></div>
    <div class="list" id="list"></div>
  </section>
</div>

<button class="fab" id="addBtn">+ Add spend</button>

<div class="sheet-bg" id="addSheet" hidden>
  <form class="sheet" id="addForm" autocomplete="off">
    <h3>New card spend</h3>
    <input class="amount" id="fAmount" type="text" inputmode="decimal" placeholder="0.00" aria-label="Amount in AED" required>
    <div class="chips" id="fCats" role="group" aria-label="Category"></div>
    <label>Where<input id="fMerchant" type="text" placeholder="e.g. Carrefour, ADNOC, Talabat" list="merchants"></label>
    <datalist id="merchants"></datalist>
    <div class="row2">
      <label>Card<select id="fCard"></select></label>
      <label>Date<input id="fDate" type="date" required></label>
    </div>
    <label>Who<div class="who-toggle" id="fWho"></div></label>
    <label>Note (optional)<input id="fNote" type="text"></label>
    <button class="primary" type="submit">Save</button>
    <button class="ghost" type="button" id="addCancel">Cancel</button>
  </form>
</div>

<div class="sheet-bg" id="setSheet" hidden>
  <form class="sheet" id="setForm" autocomplete="off">
    <h3>Settings</h3>
    <label>Paste setup link (optional)<input id="sLink" type="url" placeholder="https://…#s=…"></label>
    <label>Google Sheet link (Apps Script web app URL)<input id="sUrl" type="url" placeholder="https://script.google.com/macros/s/…/exec"></label>
    <label>PIN (the TOKEN in your script)<input id="sToken" type="password"></label>
    <label>This phone belongs to<div class="who-toggle" id="sWho"></div></label>
    <label>Names (you, partner)<div class="row2"><input id="sName1" type="text"><input id="sName2" type="text"></div></label>
    <label>Cards (comma separated)<input id="sCards" type="text"></label>
    <label>Monthly card budget (AED)<input id="sBudget" type="text" inputmode="numeric"></label>
    <button class="primary" type="submit">Save settings</button>
    <button class="ghost" type="button" id="shareBtn">Copy setup link for the other phone</button>
    <input id="shareOut" type="text" readonly hidden>
    <div class="msg" id="setMsg"></div>
    <button class="ghost" type="button" id="setCancel">Close</button>
  </form>
</div>

<div class="sheet-bg" id="delSheet" hidden>
  <div class="sheet">
    <h3>Delete this entry?</h3>
    <div class="msg" id="delText"></div>
    <button class="primary" style="background: var(--bad)" id="delYes">Delete</button>
    <button class="ghost" id="delNo">Keep</button>
  </div>
</div>

<script>
(() => {
  const CATS = ['Groceries', 'Dining', 'Delivery', 'Fuel & car', 'Baby', 'Health', 'Shopping', 'Bills', 'Travel', 'Family', 'Home', 'Other'];
  const $ = id => document.getElementById(id);
  const store = {
    get(k, d) { try { const v = localStorage.getItem('cs_' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('cs_' + k, JSON.stringify(v)); } catch (e) {} }
  };
  const fmt = n => Number(n || 0).toLocaleString('en-US', { maximumFractionDigits: 0 });
  const fmt2 = n => Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const todayStr = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
  const monthOf = s => s.slice(0, 7);
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

  let cfg = Object.assign({ url: '', token: '', me: 0, names: ['Antonio', 'Rima'], cards: ['ADCB 365', 'Other card'], budget: 28500 }, store.get('cfg', {}));
  let month = monthOf(todayStr());
  let rows = store.get('cache_' + month, []);
  let pending = store.get('pending', []);
  let delId = null;

  // Setup link: #s=<base64 json> fills URL and PIN on the other phone.
  if (location.hash.startsWith('#s=')) {
    try {
      const s = JSON.parse(decodeURIComponent(escape(atob(location.hash.slice(3)))));
      cfg.url = s.url || cfg.url; cfg.token = s.token || cfg.token; if (s.names) cfg.names = s.names; if (s.cards) cfg.cards = s.cards; if (s.budget) cfg.budget = s.budget;
      cfg.me = (s.me === 0 || s.me === 1) ? s.me : 1; store.set('cfg', cfg);
      if (!store.get('setupShown', false)) { store.set('setupShown', true); setTimeout(() => toast('Setup loaded. Now add this page to your home screen.'), 300); }
    } catch (e) {}
  }

  function toast(t) { const el = document.createElement('div'); el.className = 'toast'; el.textContent = t; document.body.appendChild(el); setTimeout(() => el.remove(), 2600); }
  function setStatus(t, err) { const s = $('status'); s.textContent = t || ''; s.className = 'msg' + (err ? ' err' : ''); }

  async function api(method, payload) {
    if (!cfg.url || !cfg.token) throw new Error('Open Settings and add the Google Sheet link and PIN.');
    let res;
    if (method === 'GET') {
      const u = cfg.url + '?token=' + encodeURIComponent(cfg.token) + '&month=' + encodeURIComponent(payload.month);
      res = await fetch(u, { method: 'GET', redirect: 'follow' });
    } else {
      res = await fetch(cfg.url, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ token: cfg.token }, payload)) });
    }
    const j = await res.json();
    if (!j.ok) throw new Error(j.error || 'The sheet refused the request.');
    return j;
  }

  async function flush() {
    if (!pending.length || !cfg.url) return;
    try {
      await api('POST', { items: pending });
      pending = []; store.set('pending', pending);
    } catch (e) { /* stays queued, retried next time */ }
  }

  async function load() {
    setStatus('Syncing…');
    await flush();
    try {
      const j = await api('GET', { month });
      rows = j.rows; store.set('cache_' + month, rows);
      setStatus(pending.length ? pending.length + ' entr' + (pending.length > 1 ? 'ies' : 'y') + ' waiting to sync' : '');
    } catch (e) {
      rows = store.get('cache_' + month, []);
      setStatus(navigator.onLine ? e.message : 'Offline. Showing last saved entries.', navigator.onLine);
    }
    render();
  }

  function render() {
    const [y, m] = month.split('-').map(Number);
    $('monthLabel').textContent = new Date(y, m - 1, 1).toLocaleString('en-US', { month: 'long', year: 'numeric' });
    const all = rows.concat(pending.filter(p => monthOf(p.date) === month).map(p => Object.assign({ _pending: true }, p)));
    const total = all.reduce((s, r) => s + Number(r.amount), 0);
    $('total').textContent = 'AED ' + fmt(total);
    const b = Number(cfg.budget) || 0, pct = b ? total / b : 0;
    const bar = $('budgetBar'); bar.firstElementChild.style.width = Math.min(100, pct * 100) + '%'; bar.classList.toggle('over', pct > 1);
    const now = new Date(); const isCur = month === monthOf(todayStr());
    const daysIn = new Date(y, m, 0).getDate(); const dayNo = isCur ? now.getDate() : daysIn;
    $('budgetText').textContent = b ? (total <= b ? fmt(b - total) + ' left of ' + fmt(b) : fmt(total - b) + ' over the ' + fmt(b) + ' budget') + (isCur ? ' · pace ' + fmt(total / dayNo * daysIn) + ' for the month' : '') : '';
    $('n1').textContent = cfg.names[0]; $('n2').textContent = cfg.names[1];
    $('t1').textContent = 'AED ' + fmt(all.filter(r => r.who === cfg.names[0]).reduce((s, r) => s + Number(r.amount), 0));
    $('t2').textContent = 'AED ' + fmt(all.filter(r => r.who === cfg.names[1]).reduce((s, r) => s + Number(r.amount), 0));

    const byCat = {}; all.forEach(r => byCat[r.category] = (byCat[r.category] || 0) + Number(r.amount));
    const cats = Object.entries(byCat).sort((a, b) => b[1] - a[1]); const mx = cats.length ? cats[0][1] : 1;
    const cEl = $('cats'); cEl.innerHTML = '';
    if (!cats.length) { const e = document.createElement('div'); e.className = 'empty'; e.textContent = 'No spending logged this month yet.'; cEl.appendChild(e); }
    cats.forEach(([c, v]) => {
      const r = document.createElement('div'); r.className = 'cat-row';
      const n = document.createElement('span'); n.textContent = c;
      const t = document.createElement('div'); t.className = 't'; const i = document.createElement('i'); i.style.width = (v / mx * 100) + '%'; t.appendChild(i);
      const a = document.createElement('em'); a.textContent = fmt(v) + ' · ' + Math.round(v / total * 100) + '%';
      r.append(n, t, a); cEl.appendChild(r);
    });

    const list = $('list'); list.innerHTML = '';
    const sorted = all.slice().sort((a, b) => (b.date + (b.logged_at || '')).localeCompare(a.date + (a.logged_at || '')));
    if (!sorted.length) { const e = document.createElement('div'); e.className = 'empty'; e.textContent = 'Tap "+ Add spend" after each card payment.'; list.appendChild(e); }
    let lastDay = '';
    sorted.forEach(r => {
      if (r.date !== lastDay) {
        lastDay = r.date; const d = document.createElement('div'); d.className = 'day';
        d.textContent = new Date(r.date + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'short', day: 'numeric', month: 'short' }); list.appendChild(d);
      }
      const it = document.createElement('div'); it.className = 'item';
      const m1 = document.createElement('div'); m1.className = 'm';
      const t1 = document.createElement('b'); t1.textContent = r.merchant || r.category;
      const t2 = document.createElement('span'); t2.textContent = [r.category, r.who, r.card, r.note].filter(Boolean).join(' · '); if (r._pending) { t2.textContent += ' · waiting to sync'; t2.classList.add('pending'); }
      m1.append(t1, t2);
      const a = document.createElement('div'); a.className = 'a'; a.textContent = fmt2(r.amount);
      const x = document.createElement('button'); x.className = 'x'; x.setAttribute('aria-label', 'Delete'); x.textContent = '×';
      x.addEventListener('click', () => askDelete(r));
      it.append(m1, a, x); list.appendChild(it);
    });
    const merch = [...new Set(rows.map(r => r.merchant).filter(Boolean))].slice(0, 50);
    $('merchants').innerHTML = ''; merch.forEach(v => { const o = document.createElement('option'); o.value = v; $('merchants').appendChild(o); });
  }

  // Add sheet
  let selCat = 'Groceries', selWho = 0;
  function chips(el, items, sel, onPick) {
    el.innerHTML = '';
    items.forEach((t, i) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.textContent = t; b.setAttribute('aria-pressed', String(sel === t || sel === i)); b.addEventListener('click', () => { onPick(t, i); chips(el, items, typeof sel === 'number' ? i : t, onPick); }); el.appendChild(b); });
  }
  function openAdd() {
    $('fAmount').value = ''; $('fMerchant').value = ''; $('fNote').value = ''; $('fDate').value = todayStr();
    selWho = cfg.me; selCat = 'Groceries';
    chips($('fCats'), CATS, selCat, t => selCat = t);
    chips($('fWho'), cfg.names, selWho, (t, i) => selWho = i);
    $('fCard').innerHTML = ''; cfg.cards.forEach(c => { const o = document.createElement('option'); o.textContent = c; $('fCard').appendChild(o); });
    $('fCard').value = store.get('lastCard', cfg.cards[0]);
    $('addSheet').hidden = false; setTimeout(() => $('fAmount').focus(), 50);
  }
  $('addBtn').addEventListener('click', openAdd);
  $('addCancel').addEventListener('click', () => $('addSheet').hidden = true);
  $('addForm').addEventListener('submit', async e => {
    e.preventDefault();
    const amount = parseFloat($('fAmount').value.replace(/,/g, ''));
    if (!(amount > 0)) { $('fAmount').focus(); toast('Type an amount above 0'); return; }
    const item = { id: uid(), date: $('fDate').value, who: cfg.names[selWho], amount, category: selCat, merchant: $('fMerchant').value.trim(), card: $('fCard').value, note: $('fNote').value.trim() };
    store.set('lastCard', item.card);
    pending.push(item); store.set('pending', pending);
    $('addSheet').hidden = true;
    if (monthOf(item.date) !== month) month = monthOf(item.date);
    render(); toast('Saved');
    await load();
  });

  // Delete
  function askDelete(r) { delId = r; $('delText').textContent = (r.merchant || r.category) + ' · AED ' + fmt2(r.amount) + ' · ' + r.date; $('delSheet').hidden = false; }
  $('delNo').addEventListener('click', () => $('delSheet').hidden = true);
  $('delYes').addEventListener('click', async () => {
    $('delSheet').hidden = true; const r = delId; if (!r) return;
    if (r._pending) { pending = pending.filter(p => p.id !== r.id); store.set('pending', pending); render(); return; }
    try { await api('POST', { action: 'delete', id: r.id }); toast('Deleted'); } catch (e) { toast(e.message); }
    load();
  });

  // Settings
  function openSet() {
    $('sLink').value = ''; $('sUrl').value = cfg.url; $('sToken').value = cfg.token; $('sName1').value = cfg.names[0]; $('sName2').value = cfg.names[1];
    $('sCards').value = cfg.cards.join(', '); $('sBudget').value = cfg.budget; $('setMsg').textContent = ''; $('shareOut').hidden = true;
    chips($('sWho'), cfg.names, cfg.me, (t, i) => cfg.me = i);
    $('setSheet').hidden = false;
  }
  $('settingsBtn').addEventListener('click', openSet);
  $('setCancel').addEventListener('click', () => $('setSheet').hidden = true);
  $('setForm').addEventListener('submit', e => {
    e.preventDefault();
    const link = $('sLink').value.trim();
    if (link.includes('#s=')) { location.hash = link.slice(link.indexOf('#s=') + 1); location.reload(); return; }
    cfg.url = $('sUrl').value.trim(); cfg.token = $('sToken').value.trim();
    cfg.names = [$('sName1').value.trim() || 'Antonio', $('sName2').value.trim() || 'Rima'];
    cfg.cards = $('sCards').value.split(',').map(s => s.trim()).filter(Boolean); if (!cfg.cards.length) cfg.cards = ['Card'];
    cfg.budget = parseFloat(String($('sBudget').value).replace(/,/g, '')) || 0;
    store.set('cfg', cfg); $('setSheet').hidden = true; toast('Settings saved'); load();
  });
  $('shareBtn').addEventListener('click', async () => {
    const payload = btoa(unescape(encodeURIComponent(JSON.stringify({ url: cfg.url, token: cfg.token, names: cfg.names, cards: cfg.cards, budget: cfg.budget }))));
    const link = location.origin + location.pathname + '#s=' + payload;
    const out = $('shareOut'); out.value = link; out.hidden = false;
    try { await navigator.clipboard.writeText(link); $('setMsg').textContent = 'Copied. Send it to the other phone and open it there once. It contains the PIN, so send it privately.'; }
    catch (e) { out.select(); $('setMsg').textContent = 'Select the link above and copy it. It contains the PIN, so send it privately.'; }
  });

  // Month nav + sync
  function shift(n) { const [y, m] = month.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); month = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); rows = store.get('cache_' + month, []); render(); load(); }
  $('prevM').addEventListener('click', () => shift(-1));
  $('nextM').addEventListener('click', () => shift(1));
  $('syncBtn').addEventListener('click', load);
  window.addEventListener('online', load);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  render();
  if (!cfg.url) { setStatus('First time? Open Settings and paste your Google Sheet link and PIN.'); }
  else load();
})();
</script>
</body>
</html>
